---
layout: default
---

<div class="portfolio">
{% for post in site.data.main.projects %}
	<div class="pitem">
		<img src="/assets/images/{{post.image}}" onclick="window.location.href={{post.link}}" />
		<div class="text">
			<div>{{post.title}}</div>
			<div class="year">{{post.year}}</div>
			<div class="author">{{post.author}}</div>
			<div class="description">Read More →</div>
		</div>
	</div>
{% endfor %}
</div>
