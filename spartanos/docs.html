---
layout: spartanos
---

<div class="portfolio">
{% for post in site.data.spartanos.docs %}
	<div class="pitem" onclick="window.location.href='/spartanos/{{post.link}}'">
		<img src="/assets/images/{{post.image}}" />
		<div class="text">
			<div>{{post.title}}</div>
			<div class="author">{{post.author}}</div>
			<div class="description">Read More →</div>
		</div>
	</div>
{% endfor %}
</div>
