---
layout: store
---

<div class="page">
	<div class="portfolio">
	{% for post in site.data.store.apps %}
			<div class="pitem" onclick="window.location.href='/store/{{post.link}}'">
				<img class="pimg" src="/Images/{{post.image}}" />
				<div class="text">
					<div>{{post.title}}</div>
					<div class="author">By: {{post.author}}</div>
					<div class="description">{{post.cost}}</div>
				</div>
			</div>
	{% endfor %}
	</div>
</div>
