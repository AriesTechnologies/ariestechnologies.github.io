<img id="nav-img" src='/assets/images/icons/SpartanOS.png' onclick="window.location.href='home.html'"/>
{% for link in site.data.spartanos.links %}
	{% if link.link contains "/" %}
		<a href="{{link.link}}" target="_blank" rel="noopener noreferrer">{{link.name}}</a>
	{% else %}
		<a href="{{link.link}}">{{link.name}}</a>
	{% endif %}
{% endfor %}
<button id='theme' type='button'></button>
