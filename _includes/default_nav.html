<img id="nav-img" src="/assets/images/icons/AriesTech.svg" onclick="window.location.href='index.html'" />
{% for link in site.data.main.links %}
	{% if link.link contains "/" %}
		<a href="{{link.link}}" target="_blank" rel="noopener noreferrer">{{link.name}}</a>
	{% else %}
		<a href="{{link.link}}">{{link.name}}</a>
	{% endif %}
{% endfor %}
