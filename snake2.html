<h1>Snake 2.0</h1>
<img src="Images/snake2.png" />
<p>Snake 2.0 (2017): was AtlasStudios version of Snake. It was designed with a local multiplayer system so one person could be the snake and the other be the enemy bird. This was AtlasStudios first attempt at coding a game in Python.</p>
