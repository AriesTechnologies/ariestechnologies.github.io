atlasdesigner_data:
    title: "AtlasDesigner"
    image: "AtlasDesigner3.png"
    description: "AtlasDesigner is AtlasCorporations vector drawing applications that is in development. Right now all it does is create an image out of text. It also handles layers internally that you can't access yet."

